# ──────────────────────────────────────────────────────────────────────────────
# Coffee Shop API – Production Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up --build -d
#   docker compose logs -f api
# ──────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── SQL Server ─────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coffee-shop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── ASP.NET Core Web API ───────────────────────────────────────────────────
  api:
    build:
      context: ./coffee_shop-mangement-API-main
      dockerfile: Dockerfile
    container_name: coffee-shop-api
    ports:
      - "8080:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      # Override the connection string at runtime (double-underscore = nested key)
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CoffeeShopDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql_data:
    driver: local
