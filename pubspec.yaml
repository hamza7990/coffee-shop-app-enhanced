name: brewhaus
description: Brewhaus Coffee Shop Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^3.3.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

  # Networking
  dio: ^5.4.0
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # Realtime
  signalr_netcore: ^1.3.4
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true